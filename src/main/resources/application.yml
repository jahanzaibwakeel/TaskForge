spring:
  application:
    name: taskforge

  datasource:
    url: jdbc:postgresql://localhost:5433/taskforge
    username: taskforge
    password: YOUR_POSTGRES_PASSWORD

  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info